<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 转文字 - 语音转写与AI润色</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e7e9ea; min-height: 100vh; }
  .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; color: #1d9bf0; }
  .subtitle { color: #71767b; font-size: 14px; margin-bottom: 20px; }
  .step-bar { display: flex; gap: 0; margin-bottom: 20px; background: #1c2732; border-radius: 12px; padding: 4px; }
  .step { flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-size: 13px; color: #71767b; cursor: pointer; transition: all 0.2s; }
  .step.active { background: #1d9bf0; color: #fff; font-weight: 600; }
  .step.done { color: #1d9bf0; }
  .upload-box { border: 2px dashed #2f3336; border-radius: 16px; padding: 48px; text-align: center; margin-bottom: 20px; transition: border-color 0.2s; cursor: pointer; }
  .upload-box:hover { border-color: #1d9bf0; }
  .upload-box.dragover { border-color: #1d9bf0; background: rgba(29,155,240,0.05); }
  .upload-icon { font-size: 48px; margin-bottom: 12px; }
  .upload-text { font-size: 16px; margin-bottom: 8px; }
  .upload-hint { font-size: 13px; color: #71767b; }
  input[type="file"] { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 8px; background: #1d9bf0; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; transition: background 0.2s; }
  .btn:hover { background: #1a8cd8; }
  .btn:disabled { background: #2f3336; color: #71767b; cursor: not-allowed; }
  /* 两列布局 */
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .result-box { background: #16181c; border: 1px solid #2f3336; border-radius: 16px; overflow: hidden; }
  .result-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2f3336; }
  .result-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .result-title .icon { font-size: 16px; }
  .char-count { font-size: 12px; color: #71767b; }
  .result-body { padding: 14px 16px; min-height: 300px; max-height: 500px; overflow-y: auto; font-size: 15px; line-height: 1.8; color: #e7e9ea; white-space: pre-wrap; word-break: break-word; }
  .result-body::-webkit-scrollbar { width: 6px; }
  .result-body::-webkit-scrollbar-track { background: #16181c; }
  .result-body::-webkit-scrollbar-thumb { background: #2f3336; border-radius: 3px; }
  .result-body:empty::before { content: '等待转写...'; color: #71767b; }
  /* 摘要单独一行 */
  .summary-box { background: #16181c; border: 1px solid #2f3336; border-radius: 16px; overflow: hidden; }
  .summary-body { padding: 14px 16px; min-height: 100px; max-height: 200px; overflow-y: auto; font-size: 14px; line-height: 1.7; color: #e7e9ea; }
  .summary-body:empty::before { content: '等待摘要...'; color: #71767b; }
  .section-label { font-size: 12px; color: #1d9bf0; font-weight: 600; margin-bottom: 8px; }
  .copy-btn { background: #2f3336; color: #e7e9ea; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: background 0.2s; }
  .copy-btn:hover { background: #3f4448; }
  .copy-btn.copied { background: #1d9bf0; }
  .polish-section { margin-top: 4px; padding-top: 12px; border-top: 1px dashed #2f3336; }
  .summary-section { margin-top: 8px; }
  /* 进度指示 */
  .realtime-section { margin-top: 12px; font-size: 13px; color: #71767b; }
  .progress-bar { height: 4px; background: #2f3336; border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: #1d9bf0; border-radius: 2px; transition: width 0.3s; width: 0%; }
  .phase { display: inline-block; background: #1d9bf0; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 6px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ MP4 转文字</h1>
  <p class="subtitle">上传视频，AI 自动转写、润色并总结（支持A股、炒股等金融内容）</p>

  <!-- 步骤条 -->
  <div class="step-bar">
    <div class="step active" id="step-upload">① 上传文件</div>
    <div class="step" id="step-upload2">② 转换音频</div>
    <div class="step" id="step-transcribe">③ 语音转写</div>
    <div class="step" id="step-polish">④ AI润色</div>
    <div class="step" id="step-summary">⑤ 摘要总结</div>
  </div>

  <!-- 上传区 -->
  <div class="upload-box" id="uploadBox" onclick="fileInput.click()">
    <div class="upload-icon">📁</div>
    <div class="upload-text">点击选择 MP4 文件，或拖拽到此处</div>
    <div class="upload-hint">支持 MP4、MOV、AVI 等格式</div>
  </div>
  <input type="file" id="fileInput" accept="video/*">

  <!-- 实时进度 -->
  <div id="progressInfo" style="display:none; margin-bottom:16px; font-size:13px; color:#71767b;">
    <span id="phaseLabel"></span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- 结果区域：左右并列 -->
  <div id="resultsArea" style="display:none">
    <div class="columns">
      <!-- 左：原始转写 -->
      <div class="result-box">
        <div class="result-header">
          <span class="result-title"><span class="icon">📝</span>原始转写</span>
          <span class="char-count" id="rawCharCount">0 字</span>
        </div>
        <div class="result-body" id="realtimeText"></div>
      </div>
      <!-- 右：AI润色 -->
      <div class="result-box">
        <div class="result-header">
          <span class="result-title"><span class="icon">✨</span>AI 润色</span>
          <span class="char-count" id="polishCharCount">0 字</span>
        </div>
        <div class="result-body" id="polishRealtimeText"></div>
      </div>
    </div>

    <!-- 摘要单独一行 -->
    <div class="summary-box">
      <div class="result-header">
        <span class="result-title"><span class="icon">🧠</span>AI 摘要与总结</span>
      </div>
      <div class="summary-body" id="summaryText"></div>
    </div>
  </div>
</div>

<script>
const uploadBox = document.getElementById('uploadBox');
const fileInput = document.getElementById('fileInput');
const resultsArea = document.getElementById('resultsArea');
const realtimeText = document.getElementById('realtimeText');
const polishRealtimeText = document.getElementById('polishRealtimeText');
const summaryText = document.getElementById('summaryText');
const rawCharCount = document.getElementById('rawCharCount');
const polishCharCount = document.getElementById('polishCharCount');
const progressInfo = document.getElementById('progressInfo');
const phaseLabel = document.getElementById('phaseLabel');
const progressFill = document.getElementById('progressFill');

let polishedFullText = '';
let summaryFullText = '';
let eventSource = null;
let streamClosed = false;

// ========== 文件上传 ==========
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) uploadFile(file);
});

uploadBox.addEventListener('dragover', (e) => { e.preventDefault(); uploadBox.classList.add('dragover'); });
uploadBox.addEventListener('dragleave', () => uploadBox.classList.remove('dragover'));
uploadBox.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadBox.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) uploadFile(file);
});

function setStep(stepId) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active', 'done'));
  const step = document.getElementById(stepId);
  if (step) step.classList.add('active');
}

function setProgress(phase, pct) {
  progressInfo.style.display = 'block';
  phaseLabel.textContent = phase;
  progressFill.style.width = pct + '%';
}

async function uploadFile(file) {
  resultsArea.style.display = 'block';
  realtimeText.textContent = '';
  polishRealtimeText.textContent = '';
  summaryText.textContent = '';
  rawCharCount.textContent = '0 字';
  polishCharCount.textContent = '0 字';
  polishedFullText = '';
  setStep('step-upload2');
  setProgress('正在转换音频…', 10);

  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch('/api/transcribe', { method: 'POST', body: formData });
    const data = await resp.json();
    if (data.error) { alert('错误: ' + data.error); return; }

    setStep('step-transcribe');
    setProgress('正在转写…', 30);
    connectStream(data.task_id);
  } catch (err) {
    alert('上传失败: ' + err.message);
  }
}

function connectStream(taskId) {
  if (eventSource) eventSource.close();
  streamClosed = false;
  eventSource = new EventSource(`/api/stream/${taskId}`);

  eventSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      handleStreamData(data);
    } catch (err) { console.error(err); }
  };

  eventSource.onerror = () => {
    if (!streamClosed) {
      streamClosed = true;
      eventSource.close();
    }
  };
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatSummaryValue(value) {
  if (value == null || value === '') return '';

  if (Array.isArray(value)) {
    const items = value
      .map(item => {
        const formatted = formatSummaryValue(item);
        return formatted ? `<li>${formatted}</li>` : '';
      })
      .filter(Boolean)
      .join('');
    return items ? `<ul style="margin:6px 0 0 20px; line-height:1.8;">${items}</ul>` : '';
  }

  if (typeof value === 'object') {
    return Object.entries(value)
      .map(([key, nested]) => {
        const formatted = formatSummaryValue(nested);
        if (!formatted) return '';
        return `
          <div style="margin-top:8px;">
            <div style="color:#9ecdf7; font-weight:600; margin-bottom:4px;">${escapeHtml(key)}</div>
            <div>${formatted}</div>
          </div>
        `;
      })
      .filter(Boolean)
      .join('');
  }

  return escapeHtml(value).replace(/\n/g, '<br>');
}

function renderSummary(summary) {
  if (!summary) return '';

  if (typeof summary === 'string') {
    return `<div style="line-height:1.8;">${escapeHtml(summary).replace(/\n/g, '<br>')}</div>`;
  }

  if (typeof summary === 'object') {
    return Object.entries(summary)
      .map(([key, value]) => {
        const formatted = formatSummaryValue(value);
        if (!formatted) return '';
        return `
          <div style="margin-bottom:14px;">
            <div style="color:#1d9bf0; font-weight:700; margin-bottom:6px;">${escapeHtml(key)}</div>
            <div>${formatted}</div>
          </div>
        `;
      })
      .filter(Boolean)
      .join('');
  }

  return `<div>${escapeHtml(summary)}</div>`;
}

function handleStreamData(data) {
  // realtimeSection from old template - define as no-op to prevent errors
  const realtimeSection = { style: {} };
  switch (data.type) {
    case 'transcribe_start':
      setStep('step-transcribe');
      setProgress('正在转写…', 30);
      break;

    case 'chunk':
      realtimeSection.style.display = 'block';
      {
        const newText = data.text || '';
        const oldText = realtimeText.textContent || '';
        // 只动画显示新增的字符
        if (newText.length > oldText.length) {
          const added = newText.slice(oldText.length);
          let charIndex = 0;
          function addNextChar() {
            if (charIndex < added.length) {
              realtimeText.textContent += added[charIndex];
              charIndex++;
              rawCharCount.textContent = realtimeText.textContent.length + ' 字';
              setTimeout(addNextChar, 30);
            }
          }
          addNextChar();
        }
      }
      setProgress('转写中…', Math.min(60, 30 + Math.floor(data.text.length / 20)));
      break;

    case 'transcribe_done':
      setStep('step-polish');
      setProgress('正在润色…', 65);
      break;

    case 'polish_start':
      break;

    case 'polish_char':
      {
        const newText = data.text || '';
        const oldText = polishRealtimeText.textContent || '';
        if (newText.length > oldText.length) {
          const added = newText.slice(oldText.length);
          let charIndex = 0;
          function addNextChar() {
            if (charIndex < added.length) {
              polishRealtimeText.textContent += added[charIndex];
              charIndex++;
              polishCharCount.textContent = polishRealtimeText.textContent.length + ' 字';
              setTimeout(addNextChar, 30);
            }
          }
          addNextChar();
        }
        polishedFullText = newText;
      }
      setProgress('润色中…', Math.min(90, 65 + Math.floor(data.text.length / 20)));
      break;

    case 'polish_done':
      // 润色一次性完成，直接显示
      if (data.polished_text) {
        polishRealtimeText.textContent = data.polished_text;
        polishCharCount.textContent = data.polished_text.length + ' 字';
      }
      break;

    case 'summary_start':
      setStep('step-summary');
      setProgress('正在总结…', 93);
      break;

    case 'summary_char':
      summaryText.textContent = data.text;
      break;

    case 'summary_done':
      if (data.summary_text) {
        summaryText.innerHTML = renderSummary(data.summary_text);
      }
      setProgress('完成', 100);
      setStep('step-summary');
      document.querySelectorAll('.step').forEach(s => s.classList.add('done'));
      break;

    case 'error':
      alert('错误: ' + (data.error || data.message || '未知错误'));
      break;
  }
}

// ========== 复制按钮功能（动态创建）==========
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('copy-btn')) {
    const targetId = e.target.dataset.target;
    const el = document.getElementById(targetId);
    if (el) {
      navigator.clipboard.writeText(el.textContent).then(() => {
        e.target.textContent = '已复制 ✓';
        e.target.classList.add('copied');
        setTimeout(() => {
          e.target.textContent = '复制';
          e.target.classList.remove('copied');
        }, 1500);
      });
    }
  }
});
</script>
</body>
</html>
