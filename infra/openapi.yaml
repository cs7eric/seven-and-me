openapi: 3.0.3
info:
  title: mp4-to-word-new backend API
  version: "1.0.0"
  description: |
    全量后端 OpenAPI 规范。Flask Blueprint 拆分：
      - `public_bp`        静态资源 / 根路径
      - `system_bp`        系统状态
      - `self_selected_bp` 自选股 + 自选分类 CRUD
      - `stock_chart_bp`   K 线 / 标的 / 题材 / 应用面分析 / 调度
      - `f10_bp`           F10 基础资料 / 题材 / 涨跌停 / 换手率
      - `mp4_history_bp`   MP4 历史记录
      - `transcription_bp` 视频转写工作流
      - `scheduler_bp`     调度器管理（手动 trigger / enable / disable / start / stop）

    直接把本文件拖入 Apifox 即可生成集合。
servers:
  - url: http://localhost:5000
    description: 本地开发（Flask 默认端口）
  - url: http://localhost:5173
    description: 通过 Vite dev server 代理

tags:
  - name: Public
  - name: System
  - name: Self-Selected
  - name: Stock Chart
  - name: F10
  - name: MP4 History
  - name: Transcription
  - name: Scheduler

paths:
  # ====================================================================
  # Public
  # ====================================================================
  /:
    get:
      tags: [Public]
      summary: 根路径（index 页）
      responses:
        "200":
          description: HTML
  /uploads/{filename}:
    get:
      tags: [Public]
      summary: 提供上传后的文件
      parameters:
        - $ref: "#/components/parameters/PathFilename"
      responses:
        "200": { description: 文件内容 }
  /outputs/{filename}:
    get:
      tags: [Public]
      summary: 提供工作流产物
      parameters:
        - $ref: "#/components/parameters/PathFilename"
      responses:
        "200": { description: 文件内容 }

  # ====================================================================
  # System
  # ====================================================================
  /api/status:
    get:
      tags: [System]
      summary: 系统状态（API key / 模型加载情况）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_configured: { type: boolean }
                  model_loaded: { type: boolean }
                  provider: { type: string, example: "deepseek" }
                  details: { type: object, additionalProperties: true }

  # ====================================================================
  # Self-Selected
  # ====================================================================
  /api/self-selected/groups:
    get:
      tags: [Self-Selected]
      summary: 列出分类（可按 group_id 过滤）
      parameters:
        - in: query
          name: group_id
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SelfSelectedGroup" }
                  count: { type: integer }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Self-Selected]
      summary: 新建分类
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfSelectedGroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item: { $ref: "#/components/schemas/SelfSelectedGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/self-selected/groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/PathGroupId"
    put:
      tags: [Self-Selected]
      summary: 更新分类
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfSelectedGroupInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item: { $ref: "#/components/schemas/SelfSelectedGroup" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Self-Selected]
      summary: 删除分类（连同下属自选股）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  group_id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/self-selected/items:
    get:
      tags: [Self-Selected]
      summary: 列出自选股（可按 group_id 过滤）
      parameters:
        - in: query
          name: group_id
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SelfSelectedItem" }
                  count: { type: integer }
                  group_id: { type: string, nullable: true }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Self-Selected]
      summary: 新建自选股
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfSelectedItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item: { $ref: "#/components/schemas/SelfSelectedItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/self-selected/items/{item_id}:
    parameters:
      - $ref: "#/components/parameters/PathItemId"
    put:
      tags: [Self-Selected]
      summary: 更新自选股
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SelfSelectedItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item: { $ref: "#/components/schemas/SelfSelectedItem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Self-Selected]
      summary: 删除自选股
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  item_id: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ====================================================================
  # Stock Chart
  # ====================================================================
  /api/stock-chart/search:
    get:
      tags: [Stock Chart]
      summary: 搜索股票
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: 代码 / 名称 / 拼音
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockSearchItem" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

  /api/stock-chart/klines:
    get:
      tags: [Stock Chart]
      summary: K 线
      parameters:
        - $ref: "#/components/parameters/QueryTargetType"
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: period
          schema: { type: string, enum: [1d, 1w, 1m, 5m, 15m, 30m, 60m, 120m], default: 1d }
        - in: query
          name: adjust
          schema: { type: string, enum: [qfq, hfq, none], default: qfq }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KLineResponse" }

  /api/stock-chart/intraday:
    get:
      tags: [Stock Chart]
      summary: 分时 + 分钟 K（多周期合并）
      parameters:
        - $ref: "#/components/parameters/QueryTargetType"
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: adjust
          schema: { type: string, enum: [qfq, hfq, none], default: qfq }
        - in: query
          name: trade_date
          schema: { type: string, format: date }
        - in: query
          name: periods
          schema: { type: string, default: "1m,5m,15m,30m" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntradayResponse" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

  /api/stock-chart/workspace:
    get:
      tags: [Stock Chart]
      summary: 获取某只票的工作区（最近用过的周期 / adjust / 标签）
      parameters:
        - $ref: "#/components/parameters/QueryTargetType"
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: name
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockWorkspace" }
    put:
      tags: [Stock Chart]
      summary: 保存工作区
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockWorkspace" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockWorkspace" }

  /api/stock-chart/annotations:
    get:
      tags: [Stock Chart]
      summary: 列标注
      parameters:
        - $ref: "#/components/parameters/QueryTargetType"
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: period
          schema: { type: string, default: 1d }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Annotation" }
    post:
      tags: [Stock Chart]
      summary: 新建标注
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annotation" }

  /api/stock-chart/annotations/{annotation_id}:
    parameters:
      - in: path
        name: annotation_id
        required: true
        schema: { type: string }
    put:
      tags: [Stock Chart]
      summary: 更新标注
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnotationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annotation" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Stock Chart]
      summary: 删除标注
      parameters:
        - $ref: "#/components/parameters/QueryTargetType"
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: period
          schema: { type: string, default: 1d }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/stock-chart/auction:
    get:
      tags: [Stock Chart]
      summary: 集合竞价
      parameters:
        - $ref: "#/components/parameters/QuerySymbol"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuctionResponse" }

  /api/stock-chart/feature-summary:
    get:
      tags: [Stock Chart]
      summary: 标的特征摘要（喂给 LLM 的总览）
      parameters:
        - $ref: "#/components/parameters/QueryTargetType"
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: adjust
          schema: { type: string, default: qfq }
        - in: query
          name: max_chars
          schema: { type: integer, default: 1000000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureSummary" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

  /api/stock-chart/auction-ai-analysis:
    post:
      tags: [Stock Chart]
      summary: 跑一次竞价 AI 分析
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target_type: { type: string, default: stock }
                symbol: { type: string, default: "000001" }
                name: { type: string }
                adjust: { type: string, default: qfq }
                max_chars: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuctionAIAnalysis" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }
    get:
      tags: [Stock Chart]
      summary: 读最近一次竞价 AI 分析快照
      parameters:
        - in: query
          name: target_type
          schema: { type: string, default: stock }
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: date
          schema: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuctionAIAnalysis" }
        "404":
          description: 暂无快照

  /api/stock-chart/auction-ai-analysis/history:
    get:
      tags: [Stock Chart]
      summary: 竞价 AI 分析历史
      parameters:
        - in: query
          name: target_type
          schema: { type: string, default: stock }
        - $ref: "#/components/parameters/QuerySymbol"
        - in: query
          name: limit
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  target_type: { type: string }
                  symbol: { type: string }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuctionAIAnalysis" }

  /api/stock-chart/auction-ai-analysis/scheduler:
    get:
      tags: [Stock Chart]
      summary: 竞价 AI 调度器状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerStatus" }

  /api/stock-chart/auction-ai-analysis/scheduler/trigger:
    post:
      tags: [Stock Chart]
      summary: 手动触发竞价 AI 调度器
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerTriggerResult" }

  /api/stock-chart/stock-meta:
    get:
      tags: [Stock Chart]
      summary: 标的 meta（行业 / 指数映射）
      parameters:
        - in: query
          name: target_type
          schema: { type: string, default: stock }
        - $ref: "#/components/parameters/QuerySymbol"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMeta" }

  /api/stock-chart/application-analysis/targets:
    get:
      tags: [Stock Chart]
      summary: 列出应用面分析的 targets（含完整 config）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApplicationAnalysisTarget" }
                  config: { $ref: "#/components/schemas/ApplicationAnalysisConfig" }
    put:
      tags: [Stock Chart]
      summary: 保存应用面分析 targets + horizon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                horizon: { $ref: "#/components/schemas/Horizon" }
                items:
                  type: array
                  items: { $ref: "#/components/schemas/ApplicationAnalysisTarget" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  config: { $ref: "#/components/schemas/ApplicationAnalysisConfig" }

  /api/stock-chart/application-analysis/results:
    get:
      tags: [Stock Chart]
      summary: 列出所有应用面分析结果（路径摘要）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object, additionalProperties: true }

  /api/stock-chart/application-analysis/results/{target_id}:
    parameters:
      - in: path
        name: target_id
        required: true
        schema: { type: string }
    get:
      tags: [Stock Chart]
      summary: 读单个 target 的应用面分析结果
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationAnalysisResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/stock-chart/application-analysis/refresh:
    post:
      tags: [Stock Chart]
      summary: 触发单个 target 的应用面分析刷新
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                target_id: { type: string, description: 必填 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationAnalysisResult" }

  /api/stock-chart/application-analysis:
    post:
      tags: [Stock Chart]
      summary: 跑一次应用面分析（不走 targets 配置）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_type, symbol]
              properties:
                target_type: { type: string, default: stock }
                symbol: { type: string }
                name: { type: string }
                adjust: { type: string, default: qfq }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationAnalysisResult" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

  /api/stock-chart/application-analysis/scheduler:
    get:
      tags: [Stock Chart]
      summary: 应用面分析调度器状态
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulerStatus" }

  /api/stock-chart/application-analysis/scheduler/start:
    post:
      tags: [Stock Chart]
      summary: 启动应用面分析调度器
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { $ref: "#/components/schemas/SchedulerStatus" }

  /api/stock-chart/application-analysis/scheduler/stop:
    post:
      tags: [Stock Chart]
      summary: 停止应用面分析调度器
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { $ref: "#/components/schemas/SchedulerStatus" }

  /api/stock-chart/application-analysis/recent30/refresh:
    post:
      tags: [Stock Chart]
      summary: 触发某 target 的近 30 个交易日快照刷新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: { type: string }
                date: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recent30Result" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/stock-chart/application-analysis/recent30/{target_id}:
    parameters:
      - in: path
        name: target_id
        required: true
        schema: { type: string }
    get:
      tags: [Stock Chart]
      summary: 近 30 日快照列表（只含摘要）
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 60, maximum: 200, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Recent30Snapshot" }

  /api/stock-chart/application-analysis/recent30/{target_id}/full:
    parameters:
      - in: path
        name: target_id
        required: true
        schema: { type: string }
    get:
      tags: [Stock Chart]
      summary: 近 30 日快照完整内容（AI Direction 卡片使用）
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 60, maximum: 200, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recent30Result" }

  /api/stock-chart/application-analysis/recent30/{target_id}/{date_key}:
    parameters:
      - in: path
        name: target_id
        required: true
        schema: { type: string }
      - in: path
        name: date_key
        required: true
        schema: { type: string, description: "YYYY-MM-DD" }
    get:
      tags: [Stock Chart]
      summary: 读某日快照
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recent30Snapshot" }

  /api/stock-chart/market-breadth:
    get:
      tags: [Stock Chart]
      summary: 大盘宽度（涨跌家数 / 涨停 / 跌停），60s 缓存
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketBreadth" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

  /api/stock-chart/market-breadth-series:
    get:
      tags: [Stock Chart]
      summary: 大盘宽度时序
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MarketBreadth" }

  /api/stock-chart/market-overview:
    get:
      tags: [Stock Chart]
      summary: 市场情景驾驶舱（首页）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketOverview" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

  # ====================================================================
  # F10
  # ====================================================================
  /api/stock-chart/f10/ping:
    get:
      tags: [F10]
      summary: F10 数据源健康检查
      responses:
        "200":
          description: OK
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/UpstreamFailure" }

