components:
  parameters:
    PathFilename:
      in: path
      name: filename
      required: true
      schema: { type: string }
    PathGroupId:
      in: path
      name: group_id
      required: true
      schema: { type: string }
    PathItemId:
      in: path
      name: item_id
      required: true
      schema: { type: string }
    QueryTargetType:
      in: query
      name: target_type
      required: false
      description: "stock / index / hk_stock / fund / ..."
      schema:
        type: string
        default: stock
        examples:
          - stock
          - index
          - hk_stock
    QuerySymbol:
      in: query
      name: symbol
      required: false
      description: |
        标的代码（`stock` 类型）或板块 / 指数代码。
        后端 helper `_symbol_arg()` 的默认值是 `000001`（**上证综合指数**），
        所以不传 symbol 时接口会返回上证指数的题材 / F10 / 估值。
        前端调用建议**显式传**，避免误以为是「随便一只票」的数据。
      schema:
        type: string
        default: "000001"
        examples:
          - "000001"
          - "600519"
          - "300750"

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              error_type: { type: string, example: bad_request }
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    ServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    UpstreamFailure:
      description: 上游数据源失败
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              error_type: { type: string, example: upstream_failure }

  schemas:
    # ---------------- 通用 ----------------
    Error:
      type: object
      properties:
        error: { type: string }
        error_type: { type: string }
    Ok:
      type: object
      properties:
        ok: { type: boolean }

    # ---------------- Self-Selected ----------------
    SelfSelectedGroup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string, description: "blue/rose/amber/..." }
        order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SelfSelectedGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string }
        order: { type: integer }
    SelfSelectedItem:
      type: object
      properties:
        id: { type: string }
        group_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        market: { type: string, description: "SH/SZ/HK/..." }
        target_type: { type: string, default: stock }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
        added_at: { type: string, format: date-time }
    SelfSelectedItemInput:
      type: object
      required: [group_id, symbol]
      properties:
        group_id: { type: string }
        symbol: { type: string }
        name: { type: string }
        market: { type: string, default: SH }
        target_type: { type: string, default: stock }
        notes: { type: string }
        tags:
          type: array
          items: { type: string }

    # ---------------- Stock Chart ----------------
    StockSearchItem:
      type: object
      properties:
        symbol: { type: string }
        name: { type: string }
        target_type: { type: string }
        market: { type: string }
        cap_style: { type: string }
    KLineBar:
      type: object
      properties:
        timestamp: { type: integer }
        trade_date: { type: string, format: date }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        amount: { type: number }
        turnover_rate: { type: number }
        turnover: { type: number }
    KLineResponse:
      type: object
      properties:
        symbol: { type: string }
        target_type: { type: string }
        period: { type: string }
        adjust: { type: string }
        updated_at: { type: string, format: date-time }
        source: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/KLineBar" }
    IntradayResponse:
      type: object
      properties:
        ok: { type: boolean }
        symbol: { type: string }
        target_type: { type: string }
        name: { type: string }
        adjust: { type: string }
        source: { type: string }
        requested_periods:
          type: array
          items: { type: string }
        intraday:
          type: object
          description: 当日分时数据
          additionalProperties: true
        klines:
          type: object
          description: 周期 → K 线列表
          additionalProperties: true
    StockWorkspace:
      type: object
      additionalProperties: true
    Annotation:
      type: object
      properties:
        id: { type: string }
        target_type: { type: string }
        symbol: { type: string }
        period: { type: string }
        timestamp: { type: integer }
        type: { type: string, description: "trendline/horizontal/text/..." }
        color: { type: string }
        label: { type: string }
        points:
          type: array
          items: { type: object, additionalProperties: true }
        note: { type: string }
        created_at: { type: string, format: date-time }
    AnnotationInput:
      type: object
      properties:
        target_type: { type: string }
        symbol: { type: string }
        period: { type: string }
        timestamp: { type: integer }
        type: { type: string }
        color: { type: string }
        label: { type: string }
        points:
          type: array
          items: { type: object, additionalProperties: true }
        note: { type: string }
    AuctionResponse:
      type: object
      additionalProperties: true
    FeatureSummary:
      type: object
      additionalProperties: true
    AuctionAIAnalysis:
      type: object
      additionalProperties: true
    StockMeta:
      type: object
      properties:
        symbol: { type: string }
        target_type: { type: string }
        capStyle: { type: string, nullable: true }
        sectorIndexSymbol: { type: string, nullable: true }
        sectorIndexName: { type: string, nullable: true }

    # ---------------- Application Analysis ----------------
    Horizon:
      type: object
      properties:
        days: { type: integer, default: 120 }
        segments: { type: integer, default: 4 }
        monthly_keep: { type: integer, default: 6 }
        weekly_keep: { type: integer, default: 12 }
    ApplicationAnalysisTarget:
      type: object
      properties:
        id: { type: string }
        target_type: { type: string, default: stock }
        symbol: { type: string }
        name: { type: string }
        adjust: { type: string, default: qfq }
        enabled: { type: boolean, default: true }
        interval_minutes: { type: integer, default: 60 }
        tags:
          type: array
          items: { type: string }
    ApplicationAnalysisConfig:
      type: object
      properties:
        version: { type: integer }
        horizon: { $ref: "#/components/schemas/Horizon" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ApplicationAnalysisTarget" }
        updated_at: { type: string, format: date-time }
    ApplicationAnalysisResult:
      type: object
      additionalProperties: true
    Recent30Snapshot:
      type: object
      additionalProperties: true
    Recent30Result:
      type: object
      additionalProperties: true
    MarketBreadth:
      type: object
      properties:
        date: { type: string, format: date }
        upCount: { type: integer }
        downCount: { type: integer }
        limitUpCount: { type: integer }
        limitDownCount: { type: integer }
        totalCount: { type: integer }
        breakRate: { type: number, nullable: true }
        maxLianBan: { type: integer, nullable: true }
        yesterdayLimitUpReturn: { type: number, nullable: true }
        totalTurnover: { type: number, nullable: true }
        downOver5Count: { type: integer, nullable: true }
        new20HighCount: { type: integer, nullable: true }
        new20LowCount: { type: integer, nullable: true }
        source: { type: string, nullable: true }
        cachedAt: { type: number, nullable: true }
    MarketOverview:
      type: object
      additionalProperties: true

    # ---------------- F10 ----------------
    LimitUpDown:
      type: object
      additionalProperties: true
    TurnoverResponse:
      type: object
      properties:
        has_cache: { type: boolean }
        symbol: { type: string }
        target_type: { type: string }
        turnover:
          type: object
          additionalProperties: true

    # ---------------- MP4 History ----------------
    MP4History:
      type: object
      additionalProperties: true
    MP4HistoryListItem:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        task_id: { type: string }
        status: { type: string, description: "pending/done/failed" }
        data_file: { type: string }
        created: { type: string, format: date-time }
    MP4HistoryCreate:
      type: object
      required: [task_id]
      properties:
        task_id: { type: string }
        title: { type: string }
        status: { type: string }

    # ---------------- Scheduler ----------------
    SchedulerStatus:
      type: object
      additionalProperties: true
    SchedulerTriggerResult:
      type: object
      additionalProperties: true
    SchedulerJob:
      type: object
      properties:
